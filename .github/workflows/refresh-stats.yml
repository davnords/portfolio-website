name: Refresh impact stats

# Keeps src/data/impact.json fresh so the Impact chart never fetches from the
# browser. Rate-limited APIs are hit here, once a night, not per visitor.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch citations and stars
        env:
          # Stars come from other repositories, which the built-in Actions token
          # cannot read — it is scoped to this one and 403s on their stargazers.
          # STATS_TOKEN is a classic PAT with public_repo. Since July 2026 the
          # stargazers listing is limited to a repo's admins and collaborators,
          # so the token has to carry those rights — a fine-grained PAT cannot
          # (it grants nothing on repos owned by others) and read-only public
          # access is refused. Without it the run still refreshes citations and
          # keeps the last known star counts.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Optional: raises the Semantic Scholar rate limit. Works without it.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: node scripts/fetch-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/impact.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/impact.json
          git commit -m "chore: refresh impact stats"
          git push
